# CI = "is this commit correct?" It never deploys anything.
# Runs on every push to main and on every PR. Fast lane first (lint), then tests,
# ML quality gates, security scans, and finally a Docker image that must boot.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  # On PRs github.sha is a temporary merge commit. Persist the source revision
  # instead so model provenance points at code that actually exists in history.
  SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.8.4
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      # Rebuild source-derived artifacts on every commit. This proves that the
      # checked-in demo artifacts remain reproducible from source and also gives
      # us fresh artifacts to publish from a successful workflow run.
      - name: Build artifacts
        run: |
          python -m training.prepare_data
          python -m training.train_intent
          python -m training.build_index

      - name: Unit and integration tests
        run: pytest -q --cov=src/app --cov-report=term-missing

      - name: ML quality gate
        run: |
          python -m training.evaluate
          python -m training.eval_retrieval
          pytest -q -m quality_gate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: models/*.joblib
          retention-days: 14

  security:
    runs-on: ubuntu-latest
    steps:
      # Gitleaks compares the PR commit range. A shallow depth=1 checkout does
      # not contain the first changed commit's parent and makes the scanner fail
      # before it scans anything.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements.txt --strict
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - name: Rebuild artifacts for the image
        run: |
          python -m training.prepare_data
          python -m training.train_intent
          python -m training.build_index
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          pull: true
          provenance: false
          sbom: false
          tags: novabank-assistant:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Application dependencies are already a blocking pip-audit gate above.
      # Trivy also sees vulnerabilities in the moving upstream base image and
      # pip's vendored metadata. Keep those findings visible instead of deleting
      # SBOM evidence from the image; publish SARIF for triage without making a
      # base-image finding silently block every application commit.
      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: novabank-assistant:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload image vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 14

      - name: Boot the container and smoke test it
        run: |
          docker run -d --name api -p 8000:8000 novabank-assistant:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/ready && break || sleep 2
          done
          bash scripts/smoke_test.sh http://localhost:8000
          docker logs api | tail -20
          docker rm -f api
