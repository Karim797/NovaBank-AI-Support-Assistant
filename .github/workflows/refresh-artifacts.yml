name: refresh-artifacts-once

on:
  push:
    branches: [fix/production-readiness]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Rebuild reproducible artifacts
        env:
          SOURCE_GIT_SHA: ${{ github.sha }}
        run: |
          python -m training.prepare_data
          python -m training.train_intent
          python -m training.build_index
      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/*.joblib reports/index_report.json reports/train_report.json
          if git diff --cached --quiet; then
            echo "Artifacts already current"
            exit 0
          fi
          git commit -m "Refresh reproducible model artifacts [skip ci]"
          git push origin HEAD:fix/production-readiness
